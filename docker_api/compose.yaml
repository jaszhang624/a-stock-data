services:
  a-stock-data-api:
    image: a-stock-data-api:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: a-stock-data-api
    restart: unless-stopped
    ports:
      - "${ASTOCK_HOST_PORT:-8765}:8000"
    volumes:
      - "${ASTOCK_HOST_DATA_DIR}:/app/data"
      - "${ASTOCK_HOST_CACHE_DIR}:/app/cache"
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
